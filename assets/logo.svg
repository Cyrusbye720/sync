<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">SYNC</title>
  <desc id="d">SYNC - Minimalist couple alarm app logo</desc>
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Outer concentric ring -->
  <circle cx="256" cy="200" r="140" fill="none" stroke="#FFFFFF" stroke-width="16"/>
  
  <!-- Inner concentric ring -->
  <circle cx="256" cy="200" r="84" fill="none" stroke="#FFFFFF" stroke-width="16"/>
  
  <!-- Center pulse core -->
  <rect x="240" y="184" width="32" height="32" fill="#FFFFFF" rx="4" ry="4"/>
  
  <!-- SYNC Brand Wordmark -->
  <text x="256" y="420" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="72" letter-spacing="14" text-anchor="middle">SYNC</text>
  
