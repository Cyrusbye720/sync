<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="ot od">
  <title id="ot">SYNC</title>
  <desc id="od">SYNC Open-graph banner</desc>
  <rect width="1280" height="640" fill="#000000"/>
  
  <!-- Left Logo Group -->
  <g transform="translate(160, 140)">
    <circle cx="160" cy="160" r="120" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <circle cx="160" cy="160" r="72" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <rect x="146" y="146" width="28" height="28" fill="#FFFFFF" rx="3"/>
    <text x="160" y="360" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="12" text-anchor="middle">SYNC</text>
    <rect x="110" y="380" width="100" height="3" fill="#FFFFFF" rx="1.5"/>
  </g>
  
  <!-- Right Metadata -->
  <g fill="#FFFFFF" font-family="'Roboto Mono', monospace" font-size="22" letter-spacing="4">
    <text x="660" y="210">WAKE / PAIR / GET OUT OF BED</text>
