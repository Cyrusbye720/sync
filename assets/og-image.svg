    <text x="660" y="298" opacity="0.85">ONE INVITE CODE. NO ACCOUNTS TO FORGET.</text>
    <text x="660" y="342" opacity="0.85">OPEN SOURCE. ANDROID + iOS.</text>
    <text x="660" y="386" opacity="0.6">v1.0.0 · brutalist-monochrome</text>
  </g>
  
  <rect x="160" y="520" width="960" height="1" fill="#FFFFFF" opacity="0.4"/>
  <text x="160" y="560" fill="#FFFFFF" font-family="'Roboto Mono', monospace" font-size="18" letter-spacing="4" opacity="0.6">github.com/Cyrusbye720/sync</text>
</svg>
