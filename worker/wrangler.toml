name = "sync-api"
main = "src/index.ts"
compatibility_date = "2025-07-14"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 */6 * * *"]

# Secrets (set via `wrangler secret put`):
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#   DISCORD_CLIENT_ID
#   DISCORD_CLIENT_SECRET
#   ADMIN_SECRET
#   SESSION_ENCRYPTION_KEY

[[d1_databases]]
binding = "DB"
database_name = "sync-sessions"
database_id = "acc1a911-598d-4ec8-9768-55453f34482f"

[[kv_namespaces]]
binding = "SESSIONS"
id = "d1197f92094c4aa895412ceea1682742"
