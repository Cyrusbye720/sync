name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'worker/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'worker/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        if: hashFiles('test/**') != ''
        run: flutter test --no-pub

      - name: Build APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://sync-api.indsasuke59.workers.dev' }}
        run: >
          flutter build apk --release --target-platform=android-arm64
          --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Rename APK to sync.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sync.apk

      - name: Upload APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/sync.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SYNC v1.0.${{ github.run_number }}"
          body: |
            ## SYNC Release
            
            - Complete production backend behind Cloudflare Worker API proxy
            - Zero Supabase/Firebase credentials in mobile client
            - Secure OAuth deep linking
            - FCM HTTP v1 push notifications via Worker
            - Hybrid realtime sync & local alarm scheduling
          files: build/app/outputs/flutter-apk/sync.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
