name: sync
description: "SYNC — A couple alarm app with shared alarm management and realtime sync."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^5.1.0

  # Authentication is provided by Supabase OAuth flows.

  # State Management
  flutter_riverpod: ^2.5.0

  # Alarms / Notifications
  alarm: ^3.1.0
  flutter_local_notifications: ^17.1.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.3.0

  # Push / Messaging
  firebase_core: ^3.6.0
  firebase_messaging: ^14.9.0

  # System
  battery_plus: ^6.0.0
  flutter_native_timezone: ^2.0.0
  wakelock_plus: ^1.2.10

  # UI
  flutter_screenutil: ^5.9.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/og-image.svg
