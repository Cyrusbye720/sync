name: sync
description: "SYNC — A couple alarm app with shared alarm management and realtime sync."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # API Client (Worker proxy)
  http: ^1.4.0
  web_socket_channel: ^3.0.0
  url_launcher: ^6.3.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Alarms / Notifications
  alarm: ^4.0.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5

  # Push / Messaging
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # System
  battery_plus: ^5.0.3
  flutter_timezone: ^5.1.0
  wakelock_plus: ^1.7.0

  # UI
  flutter_screenutil: ^5.9.3
  intl: ^0.20.3
  google_fonts: ^8.2.0
  uuid: ^4.6.0

  # Timezone helpers
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/og-image.png
    - assets/logo.svg
    - assets/og-image.svg
    - assets/audio/alarm.mp3
