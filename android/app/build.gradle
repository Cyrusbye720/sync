plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Apply the google-services plugin only when google-services.json is
// present. CI builds without Firebase credentials still succeed, but
// any contributor that drops a real google-services.json at
// android/app/google-services.json will get FCM wiring for free.
def hasGoogleServices = new File(rootDir, 'app/google-services.json').exists()
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.sync.alarm"
    // flutter_timezone (and other modern plugins) require compileSdk 35+.
    // Pin explicitly so the build doesn't drift if Flutter bumps the default.
    compileSdk 36
    // flutter_local_notifications and friends pin NDK 25.1.8937393.
    // flutter.ndkVersion is 26.x in Flutter 3.22 which some plugins reject.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // flutter_local_notifications uses java.time APIs that require core
        // library desugaring on minSdk < 26. Enable it here and add the
        // desugar dep below.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.sync.alarm"
        // Keep minSdk at 23 to support AlarmManager.setExactAndAllowWhileIdle on
        // Android 6+. Schedule exact alarms on Android 12+ require explicit
        // runtime permission.
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            // default debug signing
        }
    }

    buildTypes {
        release {
            // Sign with the debug key by default for the CI workflow.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.window:window:1.2.0'
    // Required by coreLibraryDesugaringEnabled above — provides
    // java.time / java.util.stream backports on minSdk < 26.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
